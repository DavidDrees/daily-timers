<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Daily Timers</title>
  <meta name="theme-color" content="#14532d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Daily Timers</h1>
  </header>

  <main id="app">
    <section id="view-dashboard" class="view">
      <h2 class="section-heading">Today</h2>
      <div id="timer-list" class="timer-list" aria-live="polite"></div>

      <button type="button" id="add-timer-btn" class="btn btn-primary add-timer-btn">+ Add timer</button>

      <form id="timer-form" class="timer-form hidden" novalidate>
        <h2 id="timer-form-title">Add timer</h2>
        <input type="hidden" id="timer-form-id" />
        <label>
          Name
          <input type="text" id="timer-form-name" required maxlength="60" placeholder="e.g. Standing desk" />
        </label>
        <div class="duration-fields">
          <label>
            Minutes
            <input type="number" id="timer-form-minutes" min="0" max="1439" value="0" inputmode="numeric" />
          </label>
          <label>
            Seconds
            <input type="number" id="timer-form-seconds" min="0" max="59" value="0" inputmode="numeric" />
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="timer-form-delete" class="btn btn-danger hidden">Delete</button>
          <button type="button" id="timer-form-cancel" class="btn btn-ghost">Cancel</button>
        </div>
      </form>
    </section>

    <section id="view-calendar" class="view">
      <h2 class="section-heading">This month</h2>
      <div class="streak-stats">
        <div class="streak-stat">
          <span class="streak-value" id="current-streak-value">0</span>
          <span class="streak-label">Current streak</span>
        </div>
        <div class="streak-stat">
          <span class="streak-value" id="longest-streak-value">0</span>
          <span class="streak-label">Best streak</span>
        </div>
      </div>
      <div class="calendar-nav">
        <button type="button" id="cal-prev" class="btn btn-ghost" aria-label="Previous month">&larr;</button>
        <h3 id="cal-month-label"></h3>
        <button type="button" id="cal-next" class="btn btn-ghost" aria-label="Next month">&rarr;</button>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
      <div class="calendar-legend">
        <span><i class="dot dot-complete"></i> Complete</span>
        <span><i class="dot dot-partial"></i> Partial</span>
        <span><i class="dot dot-incomplete"></i> Incomplete</span>
        <span><i class="dot dot-no-data"></i> No data</span>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <button type="button" id="export-btn" class="btn btn-ghost btn-small">Export data</button>
    <label class="btn btn-ghost btn-small file-btn">
      Import data
      <input type="file" id="import-input" accept="application/json" hidden />
    </label>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
